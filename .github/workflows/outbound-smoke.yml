name: outbound-smoke

on:
  workflow_dispatch:
  push:
    paths:
      - "shell/outbound.py"
      - "shell/custom.py"
      - "shell/api.py"
      - "shell/routing.py"
      - "tests/test_outbound.py"
      - "scripts/dev/verify_outbound_http.py"
      - ".github/workflows/outbound-smoke.yml"

permissions:
  contents: read

concurrency:
  group: outbound-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  outbound:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install httpx
        run: python -m pip install --upgrade pip "httpx>=0.27,<1"
      - name: Zero-dependency policy tests
        run: python tests/test_outbound.py
      - name: Real HTTP transport smoke
        run: python scripts/dev/verify_outbound_http.py
