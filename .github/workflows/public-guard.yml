name: public-guard

on:
  push:
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Secret scan
        run: python scripts/secret_scan.py
      - name: Zero-dependency tests
        run: |
          python tests/test_routing.py
          python tests/test_limits.py
          python tests/test_openai_compat.py
          python tests/test_fixtures.py
          python tests/test_golden_skill.py
          python tests/test_persona_structure.py
          python tests/test_field_mapping.py
          python tests/test_bridge_model.py
          python tests/test_custom_provider.py
          python tests/test_smoke.py
