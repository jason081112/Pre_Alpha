name: limits-smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install HTTP test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi>=0.110,<1" "uvicorn>=0.27,<1" "httpx>=0.27,<1" "pydantic>=2,<3"
      - name: Zero-dependency limits tests
        run: python tests/test_limits.py
      - name: Real HTTP limits smoke
        run: python scripts/dev/verify_limits_http.py
