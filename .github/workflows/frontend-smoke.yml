name: frontend-smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Static security baseline (#82)
        run: python3 scripts/dev/check_frontend_security.py
      - name: Privacy consent store (#76)
        run: python3 tests/test_consent.py
      - name: Persona scope (#99)
        run: python3 tests/test_persona_scope.py
      - name: Output guard (#58 / #100)
        run: python3 tests/test_output_guard.py
      - name: Moderation store (#100)
        run: python3 tests/test_moderation.py
      - name: Repo hygiene — no secrets or chat dumps (#59)
        run: python3 scripts/dev/check_repo_hygiene.py
      - name: Model disclosure page in sync (#100)
        run: python3 scripts/dev/gen_models_page.py --check
      - name: Provider training policy coverage (#77)
        run: python3 scripts/dev/check_provider_policy.py
      - name: Billing & trial state machine (#102)
        run: python3 tests/test_billing.py
      - name: Pricing page in sync (#102)
        run: python3 scripts/dev/gen_pricing_page.py --check
      - name: P0 behaviors (persona switch / reconnect resync)
        run: node tests/ui_p0_smoke.mjs
      - name: Debug event log
        run: node tests/ui_debug_smoke.mjs
      - name: Rhythm scheduler (#95)
        run: node tests/ui_rhythm_smoke.mjs
